# cal.fw_version:
# *.ant_delay:
#      This value may be over-ridden by /mnt/vendor/persist/uwb/cal-factory.conf.

# *.ant_delay.force_value.1
#      This value may be used to force/over-ride the factory cal.
#      cal-<revision>.conf can be used to select / use this.

# *.ant_delay.[lower|upper]_limit
#      picked ant_delay will be clamped within this range.


# Channel 5
cal.ant1.ch5.ant_delay=15104
# 15104 + -56 = 15048
cal.ant1.ch5.ant_delay.force_value.1=15048
cal.ant1.ch5.ant_delay.lower_limit=14913
cal.ant1.ch5.ant_delay.upper_limit=15223

# Channel 9
cal.ant1.ch9.ant_delay=15152
# 15152 + -56 = 15096
cal.ant1.ch9.ant_delay.force_value.1=15096
cal.ant1.ch9.ant_delay.lower_limit=14989
cal.ant1.ch9.ant_delay.upper_limit=15198
